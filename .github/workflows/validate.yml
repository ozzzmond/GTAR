name: Pull request validation
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Preserve DEV's complete Web suite and PR16's controller support tests.
      - run: node --test ../tests/*.test.cjs
      - run: npm test
      - run: npm run lint:sync
      - run: npm run build
