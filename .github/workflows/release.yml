# Reviewed main controller; exact DEV source is validated separately and never rewritten.
name: GTAR Web PWA PROD Promotion
on:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: Exact clean numeric canonical DEV checkpoint
        required: true
        type: string
      expected_sha:
        description: Full lowercase 40-character checkpoint SHA
        required: true
        type: string
      dry_run:
        description: Read-only readiness gates; no validation or mutation
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: gtar-prod-promotion
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  DEV_TAG: ${{ inputs.dev_tag }}
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  CONTROLLER_REF: ${{ github.ref }}
  CONTROLLER_SHA: ${{ github.sha }}
  APPROVAL_READ_TOKEN: ${{ secrets.APPROVAL_READ_TOKEN }}
  CF_PAGES_READ_TOKEN: ${{ secrets.CF_PAGES_READ_TOKEN }}
  CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      sha: ${{ steps.plan.outputs.sha }}
      prod_tag: ${{ steps.plan.outputs.prod_tag }}
      main_sha: ${{ steps.plan.outputs.main_sha }}
      refs: ${{ steps.plan.outputs.refs }}
      protection: ${{ steps.plan.outputs.protection }}
      next_dev_tag: ${{ steps.plan.outputs.next_dev_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        run: node .github/prod_controller.cjs plan
  validate:
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Checkpoint code receives no release credentials, including during npm lifecycle scripts.
    env:
      APPROVAL_READ_TOKEN: ''
      CF_PAGES_READ_TOKEN: ''
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint:sync
      - run: npm run build
        env:
          GTAR_VALIDATE_SHA: ${{ needs.plan.outputs.sha }}
  promote:
    # GitHub pauses this job for a separate native environment approval after validation.
    name: Authorize ${{ needs.plan.outputs.prod_tag }} from ${{ needs.plan.outputs.sha }}
    needs: [plan, validate]
    if: ${{ !inputs.dry_run && needs.plan.outputs.ready == 'true' }}
    environment: gtar-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      state: ${{ steps.promote.outputs.state }}
      started: ${{ steps.promote.outputs.started }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Protected environment credential; no force or rules bypass is used.
          token: ${{ secrets.PROD_PUSH_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fresh post-approval gates and one atomic non-force transaction
        id: promote
        env:
          VALIDATED_SHA: ${{ needs.plan.outputs.sha }}
          PLANNED_MAIN: ${{ needs.plan.outputs.main_sha }}
          PLANNED_PROD: ${{ needs.plan.outputs.prod_tag }}
          PLANNED_REFS: ${{ needs.plan.outputs.refs }}
          PLANNED_PROTECTION: ${{ needs.plan.outputs.protection }}
        run: node .github/prod_controller.cjs promote
  verify:
    needs: [plan, promote]
    if: ${{ always() && needs.promote.outputs.state == 'PROD_PROMOTED_BUT_UNVERIFIED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      state: ${{ steps.verify.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only Cloudflare API exact-SHA production proof
        id: verify
        env:
          PROD_TAG: ${{ needs.plan.outputs.prod_tag }}
          PROMOTION_STARTED: ${{ needs.promote.outputs.started }}
        run: node .github/prod_controller.cjs verify
  report:
    needs: [plan, validate, promote, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPROVAL_READ_TOKEN: ''
      CF_PAGES_READ_TOKEN: ''
    steps:
      - name: Report actual terminal state
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PROMOTE_STATE: ${{ needs.promote.outputs.state }}
          VERIFY_STATE: ${{ needs.verify.outputs.state }}
          PROD_TAG: ${{ needs.plan.outputs.prod_tag }}
          NEXT_DEV: ${{ needs.plan.outputs.next_dev_tag }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ] && [ "$PLAN_RESULT" = success ]; then
            echo 'DRY_RUN_READY: gates only; tests/lint/build not run; no mutation.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATE="${VERIFY_STATE:-${PROMOTE_STATE:-BLOCKED_NOT_PROMOTED}}"
          echo "STATE:$STATE|PROD:${PROD_TAG:-unknown}|NEXT_DEV_ADVISORY:${NEXT_DEV:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo 'No automatic rollback, retry, source rewrite or DEV baseline change.' >> "$GITHUB_STEP_SUMMARY"
          [ "$STATE" = VERIFIED_PROD ]
