name: Build GTAR Web Preview

on:
  push:
    tags: ['v1.0.*-dev.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Canonical DEV tag to validate and build
        required: true
        type: string

permissions:
  contents: read

jobs:
  web-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical requested tag
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [ -z "$REQUESTED_TAG" ] || ! git check-ref-format "refs/tags/$REQUESTED_TAG"; then
            echo "Invalid or missing canonical DEV tag" >&2
            exit 1
          fi
          echo "REQUESTED_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.REQUESTED_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate preview tag metadata
        run: node .github/release_metadata.cjs --tag "$REQUESTED_TAG"
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint:sync
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: web/dist/
          retention-days: 7
