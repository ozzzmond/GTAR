name: Test catalog drift
on:
  pull_request:
    paths:
      - 'web/tests/**'
      - 'web/scripts/test-catalog.cjs'
      - '.github/workflows/test-catalog.yml'
  push:
    branches: [main, dev]
    paths:
      - 'web/tests/**'
      - 'web/scripts/test-catalog.cjs'
      - '.github/workflows/test-catalog.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test web/tests/testCatalog.test.cjs
      - run: node web/scripts/test-catalog.cjs --check
