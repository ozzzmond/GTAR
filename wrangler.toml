# Cloudflare Pages Configuration for GTAR Web
# Project: gtar-web
# Authoritative URL Mappings:
# - Production: branch 'main' -> https://gtar-web.pages.dev
# - Dev Preview: branch 'dev' -> https://dev.gtar-web.pages.dev

name = "gtar-web"
pages_build_output_dir = "web/dist"
compatibility_date = "2024-09-13"

# Authoritative Branch Deployments:
# Only 'main' and 'dev' trigger builds.
# All tag events and headless previews are skipped via web/scripts/ignore-build.cjs.
[env.production]
name = "gtar-web"

[env.preview]
name = "gtar-web"
